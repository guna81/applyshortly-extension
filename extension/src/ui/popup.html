<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ApplyShortly Form Assistant</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="bar-head">
    <img class="mark" src="../../icons/logo.svg" width="32" height="32" alt="" aria-hidden="true">
    <div class="grow">
      <b>ApplyShortly Form Assistant</b>
      <small id="conn" class="conn"><span class="status-dot" id="dot"></span><span id="connText">Checking connection…</span></small>
    </div>
    <button id="settings" class="icon" type="button" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="view" aria-live="polite">
    <div class="loading"><span class="spin"></span>Checking this page…</div>
  </main>

  <section id="prefs" class="prefs" hidden>
    <div class="prefs-title">Preferences</div>
    <div class="engine-row">
      <span class="lbl"><b>Form engine</b><small id="engineHint">Rule fills first, then Agent reviews</small></span>
      <div id="engineSeg" class="seg" role="radiogroup" aria-label="Form engine">
        <button type="button" role="radio" data-engine="auto" aria-checked="true" data-tip="Fast &amp; accurate — rules fill known fields first, then Agent reviews and finishes">Auto</button>
        <button type="button" role="radio" data-engine="ai_led" aria-checked="false" data-tip="Most accurate — AI-led from start to finish for complex or custom forms">Agent</button>
        <button type="button" role="radio" data-engine="rules_led" aria-checked="false" data-tip="Fastest &amp; free — deterministic rule-based fill using 0 AI credits">Rule</button>
      </div>
    </div>
    <label class="switch-row">
      <span class="lbl"><b>Auto apply</b><small>Submits after a countdown you can cancel</small></span>
      <input id="autoApply" type="checkbox" class="switch">
    </label>
    <label class="switch-row">
      <span class="lbl"><b>Auto-draft open-ended answers</b><small>Drafts long &amp; screening answers, uses credits</small></span>
      <input id="aiDrafts" type="checkbox" class="switch">
    </label>
    <label class="switch-row">
      <span class="lbl"><b>Fill optional fields</b><small>Also fills fields that aren’t required</small></span>
      <input id="fillOptional" type="checkbox" class="switch">
    </label>
  </section>

  <footer id="foot" class="foot muted" hidden></footer>

  <script src="../shared/ui/panel-model.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
